<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gendanken Palast</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5.0">
</head>
<body class="scene-portada">
    <!-- WebGL Canvas Container -->
    <div id="webgl-container"></div>

    <!-- ESCENA 1: PORTADA (Solo el texto "Gendanken Palast" arriba y centrado) -->
    <header id="portada-header">
        <h1 class="palast-title">Gendanken Palast</h1>
    </header>

    <!-- ESCENA 2: Contenedor de Etiquetas Proyectadas de Conceptos -->
    <div id="labels-container" class="hidden"></div>

    <!-- Panel de Explicación Breve (Se abre al hacer clic/tocar un punto y se cierra al tocar fuera) -->
    <div id="info-modal-backdrop" class="modal-backdrop hidden">
        <div id="info-card" class="info-card">
            <button id="modal-close" class="modal-close" aria-label="Cerrar">&times;</button>
            <div class="card-category-badge" id="card-category"></div>
            <h2 class="card-title" id="card-title"></h2>
            <p class="card-description" id="card-desc"></p>
            <div class="card-connections" id="card-connections"></div>
        </div>
    </div>

    <!-- Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <!-- Main Script -->
    <script src="main.js?v=5.0"></script>
</body>
</html>
